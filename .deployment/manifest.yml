# Machine-readable deployment manifest — FanFuel Hub / Artist Growth Hub.
#
# Agents: PARSE this before any deploy/database action. Prose lives in /CLAUDE.md,
# docs/AGENT_BOOTSTRAP.md and docs/SUPABASE_ACCESS.md; this file is the structured
# source of truth for the critical deploy facts so they don't live only in prose.
# Mirror of .deployment/manifest.json (keep both in sync).

project: FanFuel Hub
canonical_repo: fendifrost-dot/fan-growth-pilot
canonical_branch: main

deployment:
  provider: lovable
  edge_functions: lovable_edge_functions   # redeploy via Lovable Edge Functions, NOT `supabase functions deploy`

database:
  provider: lovable_supabase
  project_ref: vsemrziqxrrfcquxfnwd
  apply_sql_via: lovable_sql_editor        # paste, don't type
  migrations_source_of_truth: supabase/migrations
  supabase_cli_403_is_false_wall: true

# Hard "do not" list. Doing any of these = STOP and re-read /CLAUDE.md + docs/AGENT_BOOTSTRAP.md.
forbidden:
  - standalone_supabase   # no supabase.com dashboard/login unless Lovable itself links you in
  - archived_clone        # do not act from an archived / mirror copy of the repo
  - local_sql             # no local/CLI SQL apply — Lovable SQL Editor only
  - stale_repo            # e.g. fendifrost-dot/artistgrowthhub (stale sibling, no live traffic)

see:
  - /CLAUDE.md
  - docs/AGENT_BOOTSTRAP.md
  - docs/SUPABASE_ACCESS.md
