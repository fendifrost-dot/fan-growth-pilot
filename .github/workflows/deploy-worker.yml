name: Deploy Cloudflare Worker

# Deploys the smart-link OG/favicon Worker (public/cloudflare-worker.js) from the
# repo whenever it changes on main — no more hand-pasting into the CF dashboard.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until those secrets are set, the deploy step is skipped (the job stays green).

on:
  push:
    branches: [main]
    paths:
      - 'public/cloudflare-worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skipped (no Cloudflare credentials yet)
        if: steps.creds.outputs.present != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping Worker deploy. Add them in repo Settings → Secrets to enable."
