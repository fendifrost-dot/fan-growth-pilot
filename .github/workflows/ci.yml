name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: typecheck · test · deno · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno auth + Song DNA enforcement tests
        run: |
          set -euo pipefail
          deno test --no-check --allow-env --allow-read \
            supabase/functions/_shared/song-dna-enforcement.test.ts \
            supabase/functions/_shared/ops-actors.test.ts \
            supabase/functions/_shared/handler-authz.test.ts \
            supabase/functions/_shared/outreach-auth.test.ts \
            supabase/functions/_shared/pitch-copy-integrity.test.ts \
            supabase/functions/_shared/outreach-cutover-acceptance.test.ts


      - name: Production build
        run: npm run build
