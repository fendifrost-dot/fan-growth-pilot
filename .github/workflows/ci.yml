name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm run test -- src/test/catalogRules.test.ts src/test/controlCooldown.test.ts src/test/syncRegisters.test.ts src/test/operator-registers.test.tsx src/test/no-public-isrc.test.tsx src/test/phase0-send-gates.integration.test.ts
      - name: Production build
        run: npm run build
