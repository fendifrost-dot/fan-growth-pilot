name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: typecheck · test · deno · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno shared unit tests (deterministic)
        run: |
          set -euo pipefail
          # Run every deterministic _shared Deno unit test. Opt-in live/network suites
          # must be named *.live.test.ts (or live/) and are intentionally excluded.
          mapfile -t SHARED_TESTS < <(
            find supabase/functions/_shared -maxdepth 1 -type f -name '*.test.ts' ! -name '*.live.test.ts' | sort
          )
          if [ "${#SHARED_TESTS[@]}" -eq 0 ]; then
            echo "No deterministic Deno tests found under supabase/functions/_shared" >&2
            exit 1
          fi
          echo "Running ${#SHARED_TESTS[@]} Deno shared test files (includes placement-match):"
          printf '  %s\n' "${SHARED_TESTS[@]}"
          deno test --no-check --allow-env --allow-read "${SHARED_TESTS[@]}"

      - name: Production build
        run: npm run build

  daily-ops-migrations:
    name: daily-ops migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      AGH_MIGTEST_USE_SUDO: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply daily-ops migrations + RPC conflict check
        run: bash scripts/test-daily-ops-migrations.sh
