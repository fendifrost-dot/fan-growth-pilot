name: Pipeline repair integration
on:
  pull_request:
    branches: [main]
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Test exact migrations and policy transitions in isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/pipeline-schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260928120000_record_review_and_fit_requeue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929150000_playlist_inventory_requeue_safety.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930190000_pipeline_repair.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-pipeline-repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261004140000_pitch_template_plain_text.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261004141000_bounced_send_not_delivered.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261004142000_playlistdock_form_slug.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-playlist-pipeline-bugfix.sql
      - name: Response attribution + route recertification (20260930210000)
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/pipeline-auth-shim.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260927120000_route_hold_and_candidate_log.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930210000_response_attribution_route_recert.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-response-attribution-route-recert.sql
